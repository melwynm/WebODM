# Production hardening overlay.
#
# Use with the base compose files, for example:
# docker compose -f docker-compose.yml -f docker-compose.nodeodm.yml -f docker-compose.ssl.yml -f docker-compose.production.yml up -d

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  db:
    logging: *production-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-webodm_dev}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  broker:
    logging: *production-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  webapp:
    logging: *production-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/status/ >/dev/null || curl -fkfsS https://localhost:8000/api/status/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    logging: *production-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker inspect ping -d celery@$$(hostname) -t 10 >/dev/null || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  yamlnodeodm:
    logging: *production-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/info >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
