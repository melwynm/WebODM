# Optional AirTwin connectivity overlay. The base standalone stack is unchanged.
# Create the network once with: docker network create airtwin

services:
  webapp:
    networks:
      default: {}
      airtwin:
        aliases:
          - webodm
  worker:
    networks:
      default: {}
      airtwin: {}

networks:
  default: {}
  airtwin:
    external: true
    name: ${AIRTWIN_DOCKER_NETWORK:-airtwin}
